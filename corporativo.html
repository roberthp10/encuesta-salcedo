<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Satisfacción - Salcedo Motors</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #0d3b66; /* Azul corporativo */
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 35px 25px 30px;
      width: 100%;
      max-width: 390px;
      text-align: center;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.25);
    }
    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70px;
    }
    .logo {
      max-width: 160px;
      max-height: 80px;
      object-fit: contain;
    }
    .step-counter {
      font-size: 14px;
      font-weight: 800;
      color: #777777;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .question-title {
      font-size: 17px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 25px;
      line-height: 1.4;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .options-group {
      text-align: left;
      margin: 25px 0 35px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-left: 20px;
    }
    .options-group label {
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    /* Indicador de Calificación Grande y Profesional */
    .rating-display-container {
      margin: 10px 0 20px;
      height: 95px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .rating-number {
      font-size: 48px;
      font-weight: 900;
      color: #0d3b66;
      line-height: 1;
    }
    .rating-text {
      font-size: 14px;
      font-weight: 800;
      color: #0d3b66;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 5px;
      background-color: #f0f4f8;
      padding: 4px 14px;
      border-radius: 20px;
      min-width: 130px;
    }

    /* Control deslizante interactivo estilizado */
    .slider-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 30px;
    }
    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 5px;
      background: #e0e0e0;
      outline: none;
      cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0d3b66;
      border: 3px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .slider::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }
    .slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0d3b66;
      border: 3px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    /* Escala numérica de referencia inferior */
    .slider-scale {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      margin-top: 8px;
    }
    .slider-scale span {
      font-size: 11px;
      font-weight: 750;
      color: #777777;
    }

    .textarea-obs {
      width: 100%;
      height: 110px;
      border: 1px solid #aaaaaa;
      border-radius: 6px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 30px;
      outline: none;
    }
    .textarea-obs:focus {
      border-color: #0d3b66;
    }
    .btn-action {
      background: #0d3b66;
      color: #ffffff;
      border: none;
      padding: 10px 32px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: #092744;
    }
    .btn-action:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1VSbP6imw5MK5lwzgquWaZRm5HV-A-Pmn" alt="Salcedo Motors" class="logo">
    </div>

    <div class="step-counter" id="stepCounter">1 de 11</div>
    <div class="question-title" id="questionTitle">¿Qué tipo de servicio recibió?</div>

    <div id="contentArea">
      <!-- Paso 1: Radio Buttons -->
      <div id="step1Container" class="options-group">
        <label><input type="radio" name="servicio" value="Mantenimiento" checked> Mantenimiento</label>
        <label><input type="radio" name="servicio" value="Ventas de Repuesto"> Ventas de Repuesto</label>
        <label><input type="radio" name="servicio" value="Primarios"> Primarios</label>
      </div>

      <!-- Pasos 2 a 7 y 9 a 11: Slider con Número y Escala -->
      <div id="sliderContainer" class="hidden">
        <div class="rating-display-container">
          <div id="ratingNumber" class="rating-number">1</div>
          <div id="ratingText" class="rating-text">Por Mejorar</div>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="ratingSlider" class="slider" min="1" max="5" value="1" oninput="actualizarSliderEnVivo(this.value)">
          <div class="slider-scale">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
          </div>
        </div>
      </div>

      <!-- Paso 8: Observaciones -->
      <div id="textContainer" class="hidden">
        <textarea id="obsInput" class="textarea-obs" placeholder="Escriba aquí sus observaciones (opcional)..."></textarea>
      </div>
    </div>

    <div>
      <button type="button" id="nextBtn" class="btn-action" onclick="avanzarPaso()">Siguiente</button>
    </div>

    <div id="finalMessage" class="hidden">
      <h3>¡Muchas gracias!</h3>
      <p>Redirigiendo a WhatsApp...</p>
    </div>
  </div>

  <script>
    // URL de tu Web App en Google Apps Script
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxb_k9qoRJkxGd4uA13AHLvyBndF6go06Ee8F86g1pX6pPcv8qC679a-Z5JtF014n1h/exec";

    var preguntas = [
      { id: 1, tipo: 'radio', titulo: '¿Qué tipo de servicio recibió?' },
      { id: 2, tipo: 'slider', titulo: '¿Le atendieron de una forma cortés y amable en todo momento?' },
      { id: 3, tipo: 'slider', titulo: '¿El personal siguió sus indicaciones al pie de la letra para realizar el servicio?' },
      { id: 4, tipo: 'slider', titulo: '¿El profesional le atendió en las condiciones que usted se merece para ser atendido?' },
      { id: 5, tipo: 'slider', titulo: '¿El profesional despejó todas sus dudas de forma clara y precisa, sintiéndose usted asesorado?' },
      { id: 6, tipo: 'slider', titulo: '¿Recibió alguna llamada, mensaje, WhatsApp o email para notificar alguna anomalía?' },
      { id: 7, tipo: 'slider', titulo: '¿El servicio recibido cumplió con su expectativa?' },
      { id: 8, tipo: 'text',   titulo: '¿Desea dejar una observación con la que podamos servirle mejor en su próxima visita?' },
      { id: 9, tipo: 'slider', titulo: '¿Recomendaría nuestro servicio?' },
      { id: 10, tipo: 'slider', titulo: '¿Regresaría para tomar el servicio recibido nuevamente o cualquier otro?' },
      { id: 11, tipo: 'slider', titulo: 'Por favor, califique nuestro servicio en General' }
    ];

    // Texto de las calificaciones según la escala de valoración
    var escalaTextos = {
      "1": "Por Mejorar",
      "2": "Regular",
      "3": "Aceptable",
      "4": "Bueno",
      "5": "Excelente"
    };

    var pasoActual = 0;
    var respuestas = {};

    function actualizarSliderEnVivo(val) {
      document.getElementById('ratingNumber').innerText = val;
      document.getElementById('ratingText').innerText = escalaTextos[val] || "";
      
      var porcentaje = ((val - 1) / 4) * 100;
      var slider = document.getElementById('ratingSlider');
      slider.style.background = 'linear-gradient(to right, #0d3b66 0%, #0d3b66 ' + porcentaje + '%, #e0e0e0 ' + porcentaje + '%, #e0e0e0 100%)';
    }

    function avanzarPaso() {
      var p = preguntas[pasoActual];

      if (p.tipo === 'radio') {
        var radios = document.getElementsByName('servicio');
        for (var r of radios) {
          if (r.checked) {
            respuestas.servicio = r.value;
            break;
          }
        }
      } else if (p.tipo === 'slider') {
        respuestas['p' + p.id] = document.getElementById('ratingSlider').value;
      } else if (p.tipo === 'text') {
        respuestas.p8_observacion = document.getElementById('obsInput').value.trim();
      }

      if (pasoActual === preguntas.length - 1) {
        enviarResultados();
        return;
      }

      pasoActual++;
      mostrarPaso();
    }

    function mostrarPaso() {
      var p = preguntas[pasoActual];
      document.getElementById('stepCounter').innerText = p.id + " de " + preguntas.length;
      document.getElementById('questionTitle').innerText = p.titulo;

      document.getElementById('step1Container').classList.add('hidden');
      document.getElementById('sliderContainer').classList.add('hidden');
      document.getElementById('textContainer').classList.add('hidden');

      if (p.tipo === 'radio') {
        document.getElementById('step1Container').classList.remove('hidden');
      } else if (p.tipo === 'slider') {
        document.getElementById('sliderContainer').classList.remove('hidden');
        var slider = document.getElementById('ratingSlider');
        slider.value = 1;
        actualizarSliderEnVivo(1);
      } else if (p.tipo === 'text') {
        document.getElementById('textContainer').classList.remove('hidden');
      }

      if (pasoActual === preguntas.length - 1) {
        document.getElementById('nextBtn').innerText = "Finalizar";
      } else {
        document.getElementById('nextBtn').innerText = "Siguiente";
      }
    }

   function enviarResultados() {
      var btn = document.getElementById('nextBtn');
      btn.disabled = true;
      btn.innerText = "Enviando...";

      // Preparar parámetros codificados para evitar bloqueos CORS
      var formData = new URLSearchParams();
      for (var key in respuestas) {
        if (respuestas.hasOwnProperty(key)) {
          formData.append(key, respuestas[key]);
        }
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData.toString()
      })
      .then(function() {
        document.getElementById('stepCounter').classList.add('hidden');
        document.getElementById('questionTitle').classList.add('hidden');
        document.getElementById('contentArea').classList.add('hidden');
        btn.classList.add('hidden');
        document.getElementById('finalMessage').classList.remove('hidden');

        var telefono = "593959504717";
        var textoMsg = "¡Hola Salcedo Motors! Acabo de completar la encuesta de satisfacción." +
                       "\nServicio: " + respuestas.servicio +
                       "\nCalificación General: " + respuestas.p11 + "/5" +
                       (respuestas.p8_observacion ? "\nObservación: " + respuestas.p8_observacion : "");

        var url = "https://api.whatsapp.com/send?phone=" + telefono + "&text=" + encodeURIComponent(textoMsg);

        setTimeout(function() {
          window.location.href = url;
        }, 1500);
      })
      .catch(function(err) {
        alert("Error al enviar: " + err);
        btn.disabled = false;
        btn.innerText = "Reintentar";
      });
    }
  </script>
</body>
</html>
